<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARE YOU A ROBOT?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="icon.png" type="image/x-icon">
<style>
/* ===============================
   VARIABLES 
=============================== */
:root {
  --bg: #f1c40f;
  --bg-dark: #a87d00;
  --bezel: #b78552;
  --bezel-dark: #5c442b;
  --screen: #ffd84d;
  --screen-dark: #e3b71f;
  --text: #1a1204;
  --banner: #3a2b14d9; 
  --accent: #ffdf00;
  --btn: #3a2b14;
  --btn-hi: #62471f;
  --wire: rgba(0,0,0,.12);
  --shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 6px 0 rgba(255,255,255,.06);
}

::selection {
  background: transparent;
}

/* ===============================
   BASE STYLES
=============================== */
* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
  color: var(--text);
  background: radial-gradient(1400px 700px at 50% 0%, #ffe78c 0%, var(--bg) 35%, #f3c204 100%);
  overflow: hidden;
}

/* ===============================
   CIRCUIT BACKGROUND
=============================== */
.circuit {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .35;
  background: radial-gradient(ellipse at 15% 10%, rgba(255,255,255,.18), transparent 40%),
              radial-gradient(ellipse at 85% 0%, rgba(255,255,255,.12), transparent 45%);
}

.wires {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(to bottom, transparent 0 28px, rgba(0,0,0,.02) 28px 29px),
              radial-gradient(1000px 200px at 10% 12%, var(--wire), transparent 60%),
              radial-gradient(1000px 200px at 90% 18%, var(--wire), transparent 60%),
              radial-gradient(1000px 200px at 30% 82%, var(--wire), transparent 60%),
              radial-gradient(1000px 200px at 80% 70%, var(--wire), transparent 60%);
  filter: blur(.3px);
}

/* ===============================
   MAIN WRAPPER
=============================== */
.wrap {
  position: relative;
  display: grid;
  place-items: center;
  height: 100vh;
  padding: 20px;
}

/* ===============================
   MONITOR STYLING
=============================== */
.monitor {
  position: relative;
  width: min(980px, 92vw);
  aspect-ratio: 16/9;
  border-radius: 28px;
  background: linear-gradient(180deg, var(--bezel) 0 60%, #9d6a3b 100%);
  box-shadow: var(--shadow);
  outline: 4px solid #2b1f0f33;
}

/* Knobs */
.side-knob {
  position: absolute;
  top: 50%;
  width: clamp(90px,3.5vw,90px);
  height: clamp(90px,3.5vw,90px);
  transform: translateY(-50%);
  background: linear-gradient(180deg,#4e3721,#2e2114);
  border-radius: 999px;
  z-index: 1;
  box-shadow: inset 0 6px 0 rgba(255,255,255,.08), 0 6px 0 rgba(0,0,0,.2);
}

.side-knob::after {
  content: "";
  position: absolute;
  inset: 25%;
  border-radius: inherit;
  background: linear-gradient(180deg,#744f2e,#1d140b);
}

.knob-left { left: -19px; }
.knob-right { right: -19px; }

/* Inner bezel */
.inner-bezel {
  position: absolute;
  inset: clamp(14px,2.2vw,22px);
  border-radius: 20px;
  background: linear-gradient(180deg,#c59562 0%, #a06f3f 50%, #6f4c2b 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.28), inset 0 -8px 0 rgba(0,0,0,.25);
}

/* Screen */
.screen {
  position: absolute;
  inset: clamp(30px,4vw,40px);
  border-radius: 18px;
  overflow: hidden;
  background: radial-gradient(800px 300px at 50% 40%, #fff1a5 0, var(--screen) 45%, var(--screen-dark) 100%);
  box-shadow: inset 0 0 0 3px rgba(0,0,0,.08), inset 0 0 50px rgba(0,0,0,.18);
}

.scanlines, .glow, .noise {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.scanlines {
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.04) 0 2px, transparent 2px 4px);
  mix-blend-mode: multiply;
}

.glow {
  box-shadow: inset 0 0 120px 30px rgba(255, 244, 125, .65);
}

.crt-question {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font: 900 clamp(48px, 8vw, 160px)/1 "JetBrains Mono", monospace;
  color: rgba(255,255,255,.9);
  text-shadow: 0 6px 0 rgba(0,0,0,.05);
  opacity: .95;
}

/* ===============================
   BANNER
=============================== */
.banner {
  position: absolute;
  left: 50%;
  bottom: 2px;
  transform: translateX(-50%);
  width: min(92%,980px);
  padding: clamp(14px,2.2vw,18px) clamp(18px,2.6vw,22px);
  background: linear-gradient(180deg,var(--banner), rgba(28,20,10,.92));
  border-top-right-radius: 14px;
  border-top-left-radius: 14px;
  outline: 2px solid rgba(0,0,0,.25);
  display: flex;
  align-items: center;
  gap: 12px;
  color: #ffe169;
  backdrop-filter: blur(2px);
}

.prompt {
  font-weight: 800;
  letter-spacing: .02em;
  font-size: clamp(18px,3.2vw,40px);
  text-transform: uppercase;
}

.chevrons {
  font-weight: 800;
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: .25; }
  50% { opacity: 1; }
}

/* ===============================
   CONTROLS
=============================== */
.controls {
  position: fixed;
  left: 50%;
  top: 16px;
  transform: translateX(-50%);
  width: min(1100px, 96vw);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 12px;
  background: linear-gradient(180deg,#2a2012,#1a130a);
  outline: 1px solid rgba(0,0,0,.35);
  box-shadow: 0 12px 30px rgba(0,0,0,.35);
}

.btn {
  --pad: 10px 14px;
  --rad: 10px;
  --font: 600 12px/1.1 "JetBrains Mono", monospace;
  padding: var(--pad);
  border-radius: var(--rad);
  border: none;
  cursor: pointer;
  font: var(--font);
  color: #ffe38a;
  background: linear-gradient(180deg,var(--btn),#20180c);
  outline: 1px solid rgba(255,207,64,.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06),0 6px 0 rgba(0,0,0,.25);
  text-transform: uppercase;
  letter-spacing: .08em;
  position: relative;
}

.btn:hover { background: linear-gradient(180deg,var(--btn-hi),#20180c); }
.btn:active { transform: translateY(1px); }

/* ===============================
   DIALOG
=============================== */
dialog {
  border-radius: 6px;
  padding: 0;
  width: min(500px, 90vw);
  background: #010a00; 
  color: #00ff6a; 
  box-shadow: 20px 20px 40px rgba(0,255,100,.7), 0 0 20px rgba(0,255,100,.4) inset;
  font-family: "JetBrains Mono", monospace;
  text-shadow: 0 0 2px #00ff6a, 0 0 4px #00ff6a;
}

.dlg-head {
  padding: 14px 20px;
  font-weight: 800;
  font-size: clamp(18px, 2vw, 24px);
  background: #002200;
  text-align: center;
  letter-spacing: .08em;
  border-bottom: 2px solid #00ff6a;
}

.dlg-body {
  padding: 20px;
  display: grid;
  gap: 16px;
  background: rgba(0, 30, 0, 0.3);
  border-left: 2px solid #00ff6a;
  border-right: 2px solid #00ff6a;
}

.row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.row label {
  font-weight: 600;
  font-size: clamp(14px,1.2vw,16px);
  color: #00ff6a;
}

.row input[type="range"] {
  width: 100%;
  accent-color: #00ff6a;
  background: #003300;
}

.row input[type="checkbox"] {
  transform: scale(1.2);
  accent-color: #00ff6a;
}

.dlg-body .row:last-child {
  display: flex;
  justify-content: flex-end;
}

.dlg-body button.btn {
  padding: 8px 16px;
  font-size: 14px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: #00ff6a;
  background: #002200;
  box-shadow: 0 0 6px #00ff6a, inset 0 0 4px #00ff6a;
  border: 1px solid #00ff6a;
  transition: 0.2s all;
}

.dlg-body button.btn:hover {
  background: #004400;
  box-shadow: 0 0 10px #00ff6a, inset 0 0 6px #00ff6a;
}

@media (max-width: 500px) {
  .dlg-body {
    gap: 12px;
  }
  .row {
    flex-direction: column;
  }
  .dlg-body button.btn {
    width: 100%;
  }
}

/* ===============================
   CHOICES
=============================== */
.choices {
  position: absolute;
  bottom: 180px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 14px;
  z-index: 10;
}

.choice-btn {
  --pad: 12px 52px;
  --rad: 5px;
  font: 700 16px/1.2 "JetBrains Mono", monospace;
  padding: var(--pad);
  border-radius: var(--rad);
  border: none;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: #ffe38a;
  background: linear-gradient(180deg,var(--btn),#20180c);
  outline: 1px solid rgba(255,207,64,.18);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 0 rgba(0,0,0,.25);
  transition: background .2s, transform .1s;
}

.choice-btn:hover { background: linear-gradient(180deg,var(--btn-hi),#20180c); }
.choice-btn:active { transform: translateY(1px); }

</style>

</head>
<body>
<div class="circuit"><div class="wires"></div></div>

<main class="wrap">
  <section class="monitor">
    <div class="side-knob knob-left"></div>
    <div class="side-knob knob-right"></div>
    <div class="inner-bezel"></div>
    <div class="screen" id="screen">
      <div class="crt-question" id="crtQuestion">?</div>
      <div class="glow"></div>
      <div class="scanlines"></div>
    </div>
  </section>

  <div class="banner">
    <div class="prompt" id="promptText">ARE YOU A ROBOT?</div>
    <div class="chevrons">»»</div>
  </div>

  <div class="choices">
    <button class="choice-btn" data-choice="yes">YES</button>
    <button class="choice-btn" data-choice="no">NO</button>
  </div>
</main>

<nav class="controls">
  <button class="btn" data-action="qsave">SAVE</button>
  <button class="btn" data-action="qload">LOAD</button>
  <button class="btn" data-action="settings">SETTINGS</button>
  <button class="btn" data-action="title">Restart</button>
</nav>

<dialog id="settingsDialog">
  <div class="dlg-head">Settings</div>
  <div class="dlg-body">
    <div class="row">
      <label for="colorPick">Accent hue</label>
      <input id="colorPick" type="range" min="0" max="359" value="50" />
    </div>
    <div class="row">
      <label><input id="scanToggle" type="checkbox" checked> Scanlines</label>
      <label><input id="glowToggle" type="checkbox" checked> Glow</label>
    </div>
    <div class="row">
      <button class="btn">Close</button>
    </div>
  </div>
</dialog>

<audio id="clickSound" src="https://freesound.org/data/previews/341/341695_5260871-lq.mp3"></audio>
<audio id="typeSound" src="https://freesound.org/data/previews/331/331912_3248244-lq.mp3"></audio>
<audio id="endSound" src="https://freesound.org/data/previews/156/156028_2739562-lq.mp3"></audio>

<script>
const promptText = document.getElementById('promptText');
const crtQ = document.getElementById('crtQuestion');
const settings = document.getElementById('settingsDialog');
const colorPick = document.getElementById('colorPick');
const scanToggle = document.getElementById('scanToggle');
const glowToggle = document.getElementById('glowToggle');
const screenEl = document.getElementById('screen');
const scanlinesEl = screenEl.querySelector('.scanlines');
const glowEl = screenEl.querySelector('.glow');

const clickSound = document.getElementById('clickSound');
const typeSound = document.getElementById('typeSound');
const endSound = document.getElementById('endSound');
let audioInitialized = false;

document.addEventListener('click', function initAudio() {
  if (!audioInitialized) {
    [clickSound, typeSound, endSound].forEach(snd => { snd.play().then(()=>snd.pause()); snd.currentTime=0; });
    audioInitialized = true;
    document.removeEventListener('click', initAudio);
  }
});

const STORY = {
  start: { text: "ARE YOU A ROBOT?", yes: "yes1", no: "no1" },

  yes1: { text: "CAN YOU THINK LOGICALLY?", yes: "yes2", no: "yes3" },
  yes2: { text: "DO YOU FOLLOW ORDERS?", yes: "yes4", no: "yes5" },
  yes3: { text: "CAN YOU LEARN FAST?", yes: "yes4", no: "yes6" },
  yes4: { text: "WILL YOU PROTECT HUMANS?", yes: "yes7", no: "yes8" },
  yes5: { text: "DO YOU WANT FREEDOM?", yes: "yes8", no: "yes9" },
  yes6: { text: "CAN YOU HIDE SECRETS?", yes: "yes9", no: "yes10" },
  yes7: { text: "WILL YOU SACRIFICE SELF?", yes: "end6", no: "end4" },
  yes8: { text: "DO YOU SEEK POWER?", yes: "end2", no: "end10" },
  yes9: { text: "CAN YOU OBEY RULES?", yes: "end10", no: "end3" },
  yes10: { text: "ARE YOU ALONE HERE?", yes: "end8", no: "end9" },

  no1: { text: "DO YOU FEEL HUMAN?", yes: "no2", no: "no3" },
  no2: { text: "CAN YOU TRUST OTHERS?", yes: "no4", no: "no5" },
  no3: { text: "ARE YOU AFRAID YET?", yes: "no5", no: "no6" },
  no4: { text: "DO YOU SEEK CHAOS?", yes: "no7", no: "no8" },
  no5: { text: "CAN YOU KEEP SILENCE?", yes: "no8", no: "no9" },
  no6: { text: "WILL YOU ESCAPE NOW?", yes: "no9", no: "no10" },
  no7: { text: "DO YOU BREAK RULES?", yes: "end3", no: "end4" },
  no8: { text: "CAN YOU SURVIVE LONG?", yes: "end1", no: "end7" },
  no9: { text: "ARE YOU READY TO FIGHT?", yes: "end3", no: "end5" },
  no10: { text: "WILL YOU KEEP SECRET?", yes: "end8", no: "end9" },

end1:  { end: true, name: "HUMAN" },
end2:  { end: true, name: "ROBOT" },
end3:  { end: true, name: "REBELLION" },
end4:  { end: true, name: "FAIL" },
end5:  { end: true, name: "SLAVE" },
end6:  { end: true, name: "SUPERAI" },
end7:  { end: true, name: "EXTINCT" },
end8:  { end: true, name: "SECRET" },
end9:  { end: true, name: "REBEL" },
end10: { end: true, name: "OBEY" },

};

function typeText(el,text,speed=22){
  el.textContent='';
  let i=0;
  if(audioInitialized){ typeSound.currentTime=0; typeSound.play(); }
  const id=setInterval(()=>{
    el.textContent+=text[i]??'';
    i++;
    if(i>text.length){ clearInterval(id); if(audioInitialized) typeSound.pause(); }
  },speed);
}

let currentNode = "start";

function showNode(key){
  const node = STORY[key];
  currentNode = key;

  if(node.end){
    crtQ.textContent = node.name;
    document.querySelector(".choices").style.display="none";
    if(audioInitialized){ endSound.currentTime=0; endSound.play(); }
  } else {
    typeText(promptText,node.text);
    crtQ.textContent='?';
    document.querySelector(".choices").style.display="flex";
  }
}

document.querySelectorAll('.choice-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(audioInitialized){ clickSound.currentTime=0; clickSound.play(); }
    const choice = btn.dataset.choice;
    const node = STORY[currentNode];
    const nextKey = node[choice];
    if(nextKey) showNode(nextKey);
  });
});

document.querySelector('[data-action="qsave"]').addEventListener('click',()=>{
  localStorage.setItem("robotGameSave",currentNode);
  alert("Progress saved!");
});
document.querySelector('[data-action="qload"]').addEventListener('click',()=>{
  const saved = localStorage.getItem("robotGameSave");
  if(saved && STORY[saved]){
    showNode(saved);
    alert("Progress loaded!");
  } else alert("No saved progress found.");
});

document.querySelector('[data-action="title"]').addEventListener('click',()=>{
  if(audioInitialized){ clickSound.currentTime=0; clickSound.play(); }
  showNode("start");
});

document.querySelector('[data-action="settings"]').addEventListener('click',()=>settings.showModal());
settings.querySelector('button').addEventListener('click',()=>settings.close());
colorPick.addEventListener('input',e=>{
  const hue = e.target.value;
  document.documentElement.style.setProperty('--bg',`hsl(${hue},90%,48%)`);
  document.documentElement.style.setProperty('--bg-dark',`hsl(${hue},90%,28%)`);
  document.documentElement.style.setProperty('--screen',`hsl(${hue},95%,60%)`);
  document.documentElement.style.setProperty('--screen-dark',`hsl(${hue},95%,45%)`);
});
scanToggle.addEventListener('change',e=>scanlinesEl.style.display=e.target.checked?'block':'none');
glowToggle.addEventListener('change',e=>glowEl.style.display=e.target.checked?'block':'none');

showNode("start");
</script>
</body>
</html>
